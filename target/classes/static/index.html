<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - TimeCast</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand logo-tc" href="index.html">TC</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <form id="search-form" class="d-flex flex-grow-1 mx-lg-5 my-2 my-lg-0">
                    <div class="input-group">
                        <input id="search-input" class="form-control border-0 bg-light" type="search" placeholder="Pesquise por nome do podcast" aria-label="Search">
                        <button class="btn btn-outline-secondary" type="submit"><i class="bi bi-search"></i></button>
                    </div>
                </form>
                <ul class="navbar-nav ms-auto align-items-center">
                    <li id="upload-btn-li" class="nav-item me-3" style="display: none;">
                        <a href="upload.html" class="btn btn-success btn-sm">
                            <i class="bi bi-mic-fill me-1"></i> Novo Episódio
                        </a>
                    </li>
                    <li id="create-account-btn" class="nav-item me-2">
                        <a class="btn btn-outline-primary btn-sm" href="registrar.html">Criar conta</a>
                    </li>
                    <li id="login-btn" class="nav-item">
                        <a class="btn btn-primary btn-sm btn-fazer-login" href="login.html">Fazer login</a>
                    </li>
                    <li id="user-info" class="nav-item dropdown" style="display: none;">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle me-1"></i>
                            <span id="user-email-display"></span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                            <li><button id="logout-btn" class="dropdown-item" type="button">Sair</button></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
                <div class="position-sticky pt-4">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link active" href="index.html"><i class="bi bi-house-door-fill me-2"></i> Início</a></li>
                        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-compass me-2"></i> Aventurar</a></li>
                        <li class="nav-item"><a class="nav-link" href="favoritos.html"><i class="bi bi-heart-fill me-2"></i> Favoritos</a></li>
                        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-clock-history me-2"></i> Histórico</a></li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <h2 id="main-title" class="mb-3">Os mais ouvidos</h2>
                <div id="podcast-list" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-4 mb-5">
                    </div>
            </main>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- ELEMENTOS DO DOM ---
            const searchForm = document.getElementById('search-form');
            const searchInput = document.getElementById('search-input');
            const podcastListContainer = document.getElementById('podcast-list');
            const mainTitle = document.getElementById('main-title');
            
            const createAccountBtn = document.getElementById('create-account-btn');
            const loginBtn = document.getElementById('login-btn');
            const userInfo = document.getElementById('user-info');
            const userEmailDisplay = document.getElementById('user-email-display');
            const logoutBtn = document.getElementById('logout-btn');
            const uploadBtnLi = document.getElementById('upload-btn-li'); // Botão de upload

            // --- LÓGICA DE LOGIN/LOGOUT E EXIBIÇÃO DE BOTÕES ---
            const loggedInUserEmail = sessionStorage.getItem('loggedInUserEmail');
            if (loggedInUserEmail) {
                createAccountBtn.style.display = 'none';
                loginBtn.style.display = 'none';
                userInfo.style.display = 'block';
                uploadBtnLi.style.display = 'block'; // Mostra o botão de upload
                userEmailDisplay.textContent = loggedInUserEmail;
            } else {
                createAccountBtn.style.display = 'block';
                loginBtn.style.display = 'block';
                userInfo.style.display = 'none';

                uploadBtnLi.style.display = 'none'; // Esconde o botão de upload
            }
            logoutBtn.addEventListener('click', () => {
                sessionStorage.removeItem('loggedInUserEmail');
                window.location.href = 'login.html';
            });

            // --- FUNÇÃO PARA RENDERIZAR PODCASTS NA TELA ---
            function renderPodcasts(podcasts) {
                podcastListContainer.innerHTML = ''; // Limpa a lista atual
                if (!podcasts || podcasts.length === 0) {
                    podcastListContainer.innerHTML = '<p class="col">Nenhum podcast encontrado.</p>';
                    return;
                }
                podcasts.forEach(podcast => {
                    const podcastCardHtml = `
                        <div class="col">
                            <div class="card h-100 podcast-card">
                                <a href="podcast.html?id=${podcast.identificador}" class="text-decoration-none text-dark">
                                    <img src="${podcast.imagemUrl || 'https://via.placeholder.com/250'}" class="card-img-top" alt="Capa de ${podcast.titulo}">
                                    <div class="card-body">
                                        <h5 class="card-title">${podcast.titulo}</h5>
                                        <p class="card-text"><small class="text-muted">${podcast.autor}</small></p>
                                    </div>
                                </a>
                            </div>
                        </div>
                    `;
                    podcastListContainer.innerHTML += podcastCardHtml;
                });
            }
            
            // --- FUNÇÃO PARA BUSCAR PODCASTS (SEJA TODOS OU POR BUSCA) ---
            async function fetchAndRenderPodcasts(url) {
                podcastListContainer.innerHTML = '<p class="col">Carregando...</p>';
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`Erro na API: ${response.statusText}`);
                    const podcasts = await response.json();
                    renderPodcasts(podcasts);
                } catch (error) {
                    podcastListContainer.innerHTML = `<p class="col text-danger">Erro ao carregar podcasts: ${error.message}</p>`;
                }
            }

            // --- EVENT LISTENER PARA O FORMULÁRIO DE BUSCA ---
            searchForm.addEventListener('submit', function(event) {
                event.preventDefault(); // Impede o recarregamento da página
                const query = searchInput.value.trim();
                if (query) {
                    mainTitle.textContent = `Resultados para: "${query}"`;
                    fetchAndRenderPodcasts(`/api/podcasts/search?q=${encodeURIComponent(query)}`);
                } else {
                    mainTitle.textContent = "Os mais ouvidos";
                    fetchAndRenderPodcasts('/api/podcasts'); // Se a busca for vazia, carrega todos
                }
            });

            // --- CARGA INICIAL DE TODOS OS PODCASTS ---
            fetchAndRenderPodcasts('/api/podcasts');
        });
    </script>
</body>
</html>
