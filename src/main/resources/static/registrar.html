<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - TimeCast</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="login-form p-4 p-md-5 rounded shadow-lg bg-white" style="max-width: 450px; width: 100%;">
            <h2 class="text-center mb-4 fw-bold form-title">Crie sua conta</h2>
            <p class="text-center text-muted mb-4">É rápido e fácil.</p>
            
            <form id="registro-form">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control form-control-lg input-custom" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control form-control-lg input-custom" id="senha" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg btn-entrar mb-3">Criar Conta</button>
            </form>
            
            <div id="alert-container"></div>

            <div class="text-center mt-4">
                <span class="text-muted">Já possui uma conta?</span> 
                <a href="login.html" class="text-decoration-none fw-bold link-primary">Faça login</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registro-form').addEventListener('submit', async function(event) {
            event.preventDefault(); // Impede o envio padrão do formulário

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const alertContainer = document.getElementById('alert-container');

            try {
                const response = await fetch('http://localhost:8080/api/usuarios/registrar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, senha })
                });

                if (response.ok) {
                    const novoUsuario = await response.json();
                    showAlert('Cadastro realizado com sucesso! Você será redirecionado para o login.', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html'; // Redireciona para a página de login
                    }, 3000);
                } else {
                    const error = await response.text();
                    showAlert(`Erro ao cadastrar: ${error}`, 'danger');
                }
            } catch (error) {
                showAlert(`Erro de conexão: ${error.message}`, 'danger');
            }
        });

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alert-container');
            const wrapper = document.createElement('div');
            wrapper.innerHTML = [
                `<div class="alert alert-${type} alert-dismissible" role="alert">`,
                `   <div>${message}</div>`,
                '   <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
                '</div>'
            ].join('');

            alertContainer.innerHTML = ''; // Limpa alertas anteriores
            alertContainer.append(wrapper);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
