<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Favoritos - TimeCast</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand logo-tc" href="index.html">TC</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                 <form class="d-flex flex-grow-1 mx-lg-5 my-2 my-lg-0">
                     <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="bi bi-search"></i></span>
                        <input class="form-control border-0 bg-light" type="search" placeholder="Pesquise um podcast" aria-label="Search">
                    </div>
                </form>
                 <ul class="navbar-nav ms-auto align-items-center">
                    <li id="upload-btn-li" class="nav-item me-3" style="display: none;"><a href="upload.html" class="btn btn-success btn-sm"><i class="bi bi-mic-fill me-1"></i> Novo Episódio</a></li>
                    <li id="create-account-btn" class="nav-item me-2"><a class="btn btn-outline-primary btn-sm" href="registrar.html">Criar conta</a></li>
                    <li id="login-btn" class="nav-item"><a class="btn btn-primary btn-sm btn-fazer-login" href="login.html">Fazer login</a></li>
                    <li id="user-info" class="nav-item dropdown" style="display: none;">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle me-1"></i> <span id="user-email-display"></span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                            <li><button id="logout-btn" class="dropdown-item" type="button">Sair</button></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
                <div class="position-sticky pt-4">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-door-fill me-2"></i> Início</a></li>
                        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-compass me-2"></i> Aventurar</a></li>
                        <li class="nav-item"><a class="nav-link active" href="favoritos.html"><i class="bi bi-heart-fill me-2"></i> Favoritos</a></li>
                        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-clock-history me-2"></i> Histórico</a></li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <h2 class="mb-3">Meus Episódios Favoritos</h2>
                <ul id="favorites-list-container" class="list-group list-group-flush episode-list">
                    </ul>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        // --- LÓGICA DE LOGIN/LOGOUT ---
        const loggedInUserEmail = sessionStorage.getItem('loggedInUserEmail');
        const createAccountBtn = document.getElementById('create-account-btn');
        const loginBtn = document.getElementById('login-btn');
        const userInfo = document.getElementById('user-info');
        const userEmailDisplay = document.getElementById('user-email-display');
        const logoutBtn = document.getElementById('logout-btn');
        const uploadBtnLi = document.getElementById('upload-btn-li');
        
        if (loggedInUserEmail) {
            createAccountBtn.style.display = 'none';
            loginBtn.style.display = 'none';
            userInfo.style.display = 'block';
            uploadBtnLi.style.display = 'block';
            userEmailDisplay.textContent = loggedInUserEmail;
        } else {
            createAccountBtn.style.display = 'block';
            loginBtn.style.display = 'block';
            userInfo.style.display = 'none';
            uploadBtnLi.style.display = 'none';
        }
        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem('loggedInUserEmail');
            window.location.href = 'login.html';
        });

        // --- LÓGICA PARA CARREGAR FAVORITOS ---
        const favoritesContainer = document.getElementById('favorites-list-container');
        const favoritedIds = JSON.parse(localStorage.getItem('favoritos') || '[]');

        if (favoritedIds.length === 0) {
            favoritesContainer.innerHTML = '<p>Você ainda não marcou nenhum episódio como favorito.</p>';
            return;
        }

        try {
            favoritesContainer.innerHTML = '<p>Carregando seus favoritos...</p>';
            const response = await fetch('/api/podcasts');
            if (!response.ok) throw new Error("Não foi possível buscar os podcasts.");
            const podcasts = await response.json();
            
            let favoritedEpisodes = [];
            podcasts.forEach(podcast => {
                podcast.episodios.forEach(episode => {
                    if (favoritedIds.includes(episode.id)) {
                        // **CORREÇÃO 1: Anotando o ID e o título do podcast pai**
                        episode.podcastTitle = podcast.titulo;
                        episode.podcastIdentificador = podcast.identificador;
                        favoritedEpisodes.push(episode);
                    }
                });
            });

            favoritesContainer.innerHTML = ''; 
            if (favoritedEpisodes.length > 0) {
                favoritedEpisodes.forEach((episode, index) => {
                    const episodeHtml = `
                        <li class="list-group-item px-0">
                            <div class="d-flex">
                                <span class="me-3 text-muted fw-bold">${index + 1}.</span>
                                <div class="flex-grow-1">
                                    <p class="fw-bold mb-1">${episode.titulo}</p>
                                    <a href="podcast.html?id=${episode.podcastIdentificador}" class="text-muted small mb-2 text-decoration-none">do podcast: ${episode.podcastTitle}</a>
                                </div>
                            </div>
                            <audio controls class="w-100 mt-2" src="${episode.audioUrl}"></audio>
                        </li>
                    `;
                    favoritesContainer.innerHTML += episodeHtml;
                });
            } else {
                 favoritesContainer.innerHTML = '<p>Não foi possível encontrar os detalhes dos seus episódios favoritos. Pode ser que eles tenham sido removidos.</p>';
            }

        } catch (error) {
            favoritesContainer.innerHTML = '<p class="text-danger">Erro ao carregar favoritos: ' + error.message + '</p>';
        }
    });
    </script>
</body>
</html>
