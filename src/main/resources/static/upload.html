<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Enviar Novo Episódio - TimeCast</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 700px;">
        <div class="card">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">Enviar Novo Episódio</h2>
                <form id="upload-form">
                    <div class="mb-3">
                        <label for="podcast-select" class="form-label">Selecione o Podcast</label>
                        <select class="form-select" id="podcast-select" required>
                            <option selected disabled value="">Carregando podcasts...</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="titulo" class="form-label">Título do Episódio</label>
                        <input type="text" class="form-control" id="titulo" required>
                    </div>
                    <div class="mb-3">
                        <label for="audioFile" class="form-label">Arquivo de Áudio (MP3, WAV, etc.)</label>
                        <input class="form-control" type="file" id="audioFile" accept="audio/*" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Enviar Episódio</button>
                    </div>
                </form>
                <div id="alert-container" class="mt-3"></div>
                 <div class="progress mt-3" id="progress-bar-container" style="display: none;">
                    <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                </div>
            </div>
        </div>
        <div class="text-center mt-3">
            <a href="index.html">Voltar para o Início</a>
        </div>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', async function() {
        const podcastSelect = document.getElementById('podcast-select');
        const uploadForm = document.getElementById('upload-form');
        const alertContainer = document.getElementById('alert-container');
        
        // Popula o dropdown com os podcasts existentes
        try {
            const response = await fetch('/api/podcasts');
            const podcasts = await response.json();
            podcastSelect.innerHTML = '<option selected disabled value="">Selecione um podcast</option>';
            podcasts.forEach(p => {
                const option = document.createElement('option');
                option.value = p.identificador;
                option.textContent = p.titulo;
                podcastSelect.appendChild(option);
            });
        } catch (error) {
            podcastSelect.innerHTML = '<option selected disabled value="">Erro ao carregar podcasts</option>';
        }

        // Lida com o envio do formulário
        uploadForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const formData = new FormData();
            formData.append('podcastId', document.getElementById('podcast-select').value);
            formData.append('titulo', document.getElementById('titulo').value);
            formData.append('audioFile', document.getElementById('audioFile').files[0]);

            try {
                const response = await fetch('/api/episodios/upload', {
                    method: 'POST',
                    body: formData // Não defina Content-Type, o navegador faz isso por você
                });
                
                if (response.ok) {
                    showAlert('Episódio enviado com sucesso!', 'success');
                    uploadForm.reset();
                } else {
                    const errorData = await response.text();
                    showAlert(`Erro ao enviar: ${errorData}`, 'danger');
                }
            } catch (error) {
                showAlert(`Erro de conexão: ${error.message}`, 'danger');
            }
        });

        function showAlert(message, type) {
            alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        }
    });
</script>

</body>
</html>
