<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TimeCast</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <div class="container-fluid vh-100">
        <div class="row h-100">
            <div class="col-md-6 d-none d-md-flex align-items-center justify-content-center bg-illustration p-5">
                <div class="illustration-grid">
                    <img src="Imagens/login1.jpg" alt="Podcast Cover" class="img-fluid m-2 rounded shadow-sm">
                    <img src="Imagens/login2.jpg" alt="Podcast Cover" class="img-fluid m-2 rounded shadow-sm">
                    <img src="Imagens/login3.jpg" alt="Podcast Cover" class="img-fluid m-2 rounded shadow-sm">
                    <img src="Imagens/login4.jpg" alt="Podcast Cover" class="img-fluid m-2 rounded shadow-sm">
                     <img src="Imagens/login5.jpg" alt="Podcast Cover" class="img-fluid m-2 rounded shadow-sm">
                     <img src="Imagens/login6.jpg" alt="Podcast Cover" class="img-fluid m-2 rounded shadow-sm">
                </div>
            </div>

            <div class="col-md-6 d-flex align-items-center justify-content-center">
                <div class="login-form p-4 p-md-5 rounded shadow-lg bg-white">
                    <h2 class="text-center mb-4 fw-bold form-title">Entre para continuar</h2>
                    
                    <form id="login-form">
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control form-control-lg input-custom" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <input type="password" class="form-control form-control-lg input-custom" id="password" required>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">Lembrar de mim</label>
                            </div>
                            <a href="#" class="text-decoration-none small link-secondary">Esqueceu sua senha?</a>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-lg btn-entrar mb-3">Entrar</button>
                    </form>

                    <div id="alert-container"></div>

                    <div class="text-center mt-4">
                        <span class="text-muted">Não possui conta?</span> 
                        <a href="registrar.html" class="text-decoration-none fw-bold link-primary">Inscreva-se</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

   // Em login.html, dentro do body
<script>
    document.getElementById('login-form').addEventListener('submit', async function(event) {
        event.preventDefault();

        const email = document.getElementById('email').value;
        const senha = document.getElementById('password').value;

        try {
            const response = await fetch('http://localhost:8080/api/usuarios/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: email, senha: senha })
            });

            const loginSuccess = await response.json();

            if (loginSuccess) {
                // *** ALTERAÇÃO PRINCIPAL AQUI ***
                // Salva o e-mail do usuário para indicar que ele está logado
                sessionStorage.setItem('loggedInUserEmail', email);

                showAlert('Login bem-sucedido! Redirecionando...', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            } else {
                showAlert('E-mail ou senha inválidos.', 'danger');
            }
        } catch (error) {
            showAlert(`Erro de conexão: ${error.message}`, 'danger');
        }
    });

    function showAlert(message, type) {
        const alertContainer = document.getElementById('alert-container');
        const wrapper = document.createElement('div');
        wrapper.innerHTML = [
            `<div class="alert alert-${type} alert-dismissible" role="alert">`,
            `   <div>${message}</div>`,
            '   <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
            '</div>'
        ].join('');

        alertContainer.innerHTML = '';
        alertContainer.append(wrapper);
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
